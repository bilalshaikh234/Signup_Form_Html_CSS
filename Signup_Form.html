<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Signup Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(37, 99, 235, 0.15);
        }

        .logo {
            width: 55px;
            height: 55px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            outline: none;
            font-size: 15px;
            color: #111827;
            background: #f9fafb;
            transition: 0.25s;
        }

        .input-box input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 8px 0 22px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;
            accent-color: #2563eb;
        }

        .terms a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #9ca3af;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #e5e7eb;
            flex: 1;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #e5e7eb;
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #374151;
            transition: 0.2s;
        }

        .social-btn:hover {
            background: #f9fafb;
            border-color: #c7d2fe;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }

        .login-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        #message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 9px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .signup-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">S</div>

        <h1>Create Account</h1>
        <p class="subtitle">Join us today and get started for free</p>

        <div id="message"></div>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-box">
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-box">
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-box password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a strong password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="input-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="divider">OR</div>

        <div class="social-buttons">
            <button class="social-btn">Google</button>
            <button class="social-btn">GitHub</button>
        </div>

        <p class="login-text">
            Already have an account?
            <a href="#">Sign In</a>
        </p>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".show-password");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }

        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message = document.getElementById("message");

            if (password !== confirmPassword) {
                message.style.display = "block";
                message.style.background = "#fee2e2";
                message.style.color = "#b91c1c";
                message.textContent = "Passwords do not match.";
                return;
            }

            message.style.display = "block";
            message.style.background = "#dcfce7";
            message.style.color = "#15803d";
            message.textContent = "Account created successfully!";

            this.reset();
        });
    </script>

</body>
</html>
